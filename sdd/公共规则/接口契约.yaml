        rows:
          - - 位置
            - 参数名
            - 类型
            - 必填
            - 说明 / 示例
          - - Path
            - code
            - String
            - 是
            - 用户获取到的验证码；示例：1234567890
          - - Query
            - account
            - String
            - 是
            - 账户，手机号或邮箱（手机号需加上区号，并且进行URL encode）；示例：user@example.com
          - - Query
            - accountType
            - String
            - 是
            - |-
              账号类型
              mobile：手机号
              email：邮箱；示例：mobile
    responses: []
    rules:
      - 专属错误：1151 验证码已过期；1152 验证码错误
      - UI规则：验证码校验通过后建议返回一次性 verificationToken，避免验证码被重复使用。
  - id: AUTH-03
    title: 注册
    method: PUT
    path: /api/app/user
    authentication: 无需认证
    source_status: 复用 + regionCode 扩展
    source:
      id: SRC-PRODUCT-001
      locator: 第 8 章 / AUTH-03 / 段落 P322 / 表 T37
    parameters:
      - table: 38
        rows:
          - - 位置
            - 参数名
            - 类型
            - 必填
            - 说明 / 示例
          - - Body
            - account
            - String
            - 是
            - 账户，手机号或邮箱；示例：user@example.com
          - - Body
            - password
            - String
            - 是
            - 密码；示例：Rowan@123
          - - Body
            - type
            - String
            - 是
            - |-
              验证码类型
              mobile：手机号
              email：邮箱；示例：mobile
          - - Body
            - captcha
            - String
            - 是
            - 验证码；示例：123456
          - - Body
            - registrationId
            - Integer
            - 否
            - 极光用户ID；示例：787
          - - Body
            - system
            - String
            - 否
            - |-
              用户使用的系统
              ios：苹果
              android：安卓；示例：ios
          - - Body
            - language
            - String
            - 否
            - |-
              APP语言
              zh-CN：简体中文
              zh-TW：繁体中文
              en：英文；示例：zh-CN
          - - Body
            - regionCode
            - String
            - 是
            - 注册时选定的国家或地区代码；创建后普通用户不可直接修改；示例：US
    responses:
      - table: 39
        rows:
          - - 字段/模型
            - 类型
            - 示例
            - 说明
          - - data.accessToken
            - String
            - CbcAb4Ad-8fEE-C227-dAA3-Af2DD2B7AdaB
            - 访问token
          - - data.refreshToken
            - String
            - e6cBA3F1-fb4A-7Ae8-f8ce-Ae51CBf1ceb1
            - 刷新token。当accessToken过期后（过期时间比较短，默认是1小时），需要认证的接口会返回code=401，APP需用refreshToken去重新获取accessToken
          - - data.expiresIn
            - Integer
            - "604800"
            - refreshToken的过期时间。单位：秒，默认7天
          - - data.tokenType
            - String
            - bearer
            - |-
              认证类型。
              bearer：使用"Authorization: Bearer {{accessToken}}"请求头进行认证
          - - data.userID
            - String
            - user_01J0ROWAN0001
            - 第三方账号ID。对于微信则是unionid；对于苹果、Facebook和Twitter则是用户ID
          - - data.setting
            - Object
            - "-"
            - 用户设置；包含：language、notification、theme、wallpaper、wallpaper.2x、homeLayout
    rules:
      - 专属错误：1161 验证码已过期；1162 验证码错误；1163 用户已存在
      - UI规则：最新 UI 已补齐邮箱验证码；confirmPassword 仅在 App 本地校验，不作为接口字段；注册必须提交 regionCode，地区变更进入客服流程；协议勾选和阅读完成后才能提交。
