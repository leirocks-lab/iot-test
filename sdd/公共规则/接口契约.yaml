apis:
  - id: CONTENT-01
    title: 获取隐私政策
    method: GET
    path: /api/app/privacy
    authentication: 无需认证
    source_status: 复用 + brandId 可选
    source:
      id: SRC-PRODUCT-001
      locator: 第 8 章 / CONTENT-01 / 段落 P257 / 表 T27
    parameters:
      - table: 28
        rows:
          - - 位置
            - 参数名
            - 类型
            - 必填
            - 说明 / 示例
          - - Query
            - type
            - String
            - 是
            - |-
              返回的数据类型
              url：用户协议链接
              text：用户协议文本内容；示例：url
          - - Query
            - brandId
            - String
            - 否
            - 仅当同一接口需返回不同 App 内容时传入；可选值如 as、zafro；示例：as
          - - Query
            - regionCode
            - String
            - 否
            - 国家或地区代码；用于返回适用地区的协议内容；示例：US
    responses:
      - table: 29
        rows:
          - - 字段/模型
            - 类型
            - 示例
            - 说明
          - - data.type
            - String
            - url
            - |-
              返回的数据类型
              url：用户协议链接
              text：用户协议文本内容
          - - data.content
            - String
            - https://cdn.rowan.com/example
            - 用户协议内容。文本或网址
    rules:
      - 专属错误：1011 隐私政策不存在
      - UI规则：仅当不同 App 返回不同协议内容时传 brandId；regionCode 取注册页面已选择地区；协议正文由云端返回，阅读倒计时与滚动状态由 App 控制。
