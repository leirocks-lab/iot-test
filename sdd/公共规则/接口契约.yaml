  - id: AUTH-01
    title: 获取验证码
    method: GET
    path: /api/app/captcha
    authentication: 无需认证
    source_status: 直接复用
    source:
      id: SRC-PRODUCT-001
      locator: 第 8 章 / AUTH-01 / 段落 P290 / 表 T33
    parameters:
      - table: 34
        rows:
          - - 位置
            - 参数名
            - 类型
            - 必填
            - 说明 / 示例
          - - Query
            - account
            - String
            - 是
            - 账户。手机号或邮箱（手机号需加上区号，并且进行URL encode）；示例：user@example.com
          - - Query
            - accountType
            - String
            - 是
            - |-
              账号类型
              mobile：手机号
              email：邮箱；示例：mobile
          - - Query
            - captchaType
            - String
            - 是
            - |-
              验证码类型；在第三方登录返回“第三方账号未注册”后，跳转到绑定手机号页面发送短信验证码，这时应该传“login”类型。
              register：注册
              forget：忘记密码
              login：登录
              close：注销；示例：register
    responses: []
    rules:
      - 专属错误：1141 发送间隔过短；1142 发送次数超过限制；1143 发送失败；1144 用户已存在（captchaType=register时）
      - UI规则：服务端必须限制账号、IP 和设备维度的发送频率；验证码发送成功也不应暴露账号是否已注册。
  - id: AUTH-02
    title: 校验验证码
    method: GET
    path: /api/app/captcha/{code}
    authentication: 无需认证
    source_status: 直接复用
    source:
      id: SRC-PRODUCT-001
      locator: 第 8 章 / AUTH-02 / 段落 P306 / 表 T35
    parameters:
