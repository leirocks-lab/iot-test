buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    assert repositories.collect { it.url.toString() } == [
        'https://maven.aliyun.com/repository/google',
        'https://maven.aliyun.com/repository/central',
        'https://maven.aliyun.com/repository/gradle-plugin'
    ] : 'Buildscript repositories were not mirrored before classpath resolution'
}

def userHome = gradle.gradleUserHomeDir.canonicalPath
if (gradle.startParameter.projectProperties.lateDetachedConflict == 'true') {
    buildscript.repositories.find { it.url.toString().endsWith('/central') }.credentials {
        username = 'fixture'
        password = 'not-a-secret'
    }
    // Detached configurations never enter configurations.all. Offline mode keeps
    // this security regression test from making any authenticated HTTP request.
    def probe = buildscript.configurations.detachedConfiguration(
        buildscript.dependencies.create('fixture.mirror:missing:0.0.0'))
    probe.resolve()
    throw new GradleException('Late detached authentication guard was not invoked')
}
tasks.register('verifyMirrorRepositories') {
    doLast {
        assert userHome
        println 'PASS: pre-resolution settings, strict repository mode, buildscript and child'
        println "Gradle user home: ${userHome}"
    }
}
tasks.register('verifyIncludedMirrorRepositories') {
    dependsOn gradle.includedBuild('included').task(':verifyIncludedMirrorRepositories')
}
