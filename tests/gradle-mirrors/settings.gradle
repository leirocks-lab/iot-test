pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { name = 'privatePlugins'; url = 'https://private.example.invalid/plugins' }
    }
    // This runs before settings plugins can resolve, not after settings evaluation.
    assert repositories.collect { it.url.toString() } == [
        'https://maven.aliyun.com/repository/google',
        'https://maven.aliyun.com/repository/central',
        'https://maven.aliyun.com/repository/gradle-plugin',
        'https://private.example.invalid/plugins'
    ] : 'Plugin repositories were not mirrored before plugin resolution'
}

rootProject.name = 'mirror-verification'
include 'child'
project(':child').projectDir = file('child')
includeBuild 'included'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { name = 'privateDependencies'; url = 'https://private.example.invalid/maven' }
        if (gradle.startParameter.projectProperties.credentialConflict == 'true') {
            maven {
                name = 'credentialConflict'
                url = 'https://repo.maven.apache.org/maven2'
                credentials { username = 'fixture'; password = 'not-a-secret' }
            }
        }
    }
}

gradle.settingsEvaluated {
    assert dependencyResolutionManagement.repositories.collect { it.url.toString() } == [
        'https://maven.aliyun.com/repository/google',
        'https://maven.aliyun.com/repository/central',
        'https://private.example.invalid/maven'
    ]
}
