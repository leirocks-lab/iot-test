pluginManagement { includeBuild("../app-rn/node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(
        ["node", file("../app-rn/node_modules/react-native/cli.js").absolutePath, "config"],
        file("../app-rn"),
        files("../app-rn/package.json", "../app-rn/pnpm-lock.yaml", "../app-rn/react-native.config.js")
    )
}
rootProject.name = 'RowanAndroid'
include ':app'
includeBuild('../app-rn/node_modules/@react-native/gradle-plugin')
