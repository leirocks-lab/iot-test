plugins { id 'maven-publish' }

// Test input for the real Gradle content filter, not a replacement filter.
class FilterInput implements org.gradle.api.internal.artifacts.repositories.ArtifactResolutionDetails {
    String group
    boolean rejected = false
    org.gradle.api.artifacts.ModuleIdentifier getModuleId() {
        org.gradle.api.internal.artifacts.DefaultModuleIdentifier.newId(group, 'fixture')
    }
    org.gradle.api.artifacts.component.ModuleComponentIdentifier getComponentId() {
        org.gradle.internal.component.external.model.DefaultModuleComponentIdentifier.newId(moduleId, '1.0')
    }
    boolean isVersionListing() { false }
    void notFound() { rejected = true }
}

def originals = [:]
repositories {
    maven {
        name = 'filteredGoogle'
        url = 'https://dl.google.com/android/maven2/'
        content { includeGroup 'allowed.group' }
        metadataSources { artifact() }
        originals[name] = it
    }
    maven { name = 'googleAlias'; url = 'https://maven.google.com/' }
    maven { name = 'centralAlias'; url = 'https://repo1.maven.org/maven2/' }
    mavenLocal()
    maven { name = 'jitpack'; url = 'https://jitpack.io' }
    maven {
        name = 'privateRepo'
        url = 'https://private.example.invalid/maven'
        credentials { username = 'fixture'; password = 'not-a-secret' }
    }
    maven { name = 'lookalike'; url = 'https://repo.maven.apache.org.evil.invalid/maven2' }
    maven { name = 'customPath'; url = 'https://repo.maven.apache.org/private' }
    maven { name = 'nonstandardPort'; url = 'https://repo.maven.apache.org:8443/maven2' }
    maven { name = 'query'; url = 'https://repo.maven.apache.org/maven2?token=fixture' }
}
publishing.repositories { maven { url = 'https://repo.maven.apache.org/maven2' } }

afterEvaluate {
    repositories.maven { name = 'late'; url = 'https://repo.maven.apache.org/maven2' }
}

tasks.register('verifyIncludedMirrorRepositories') {
    doLast {
        assert repositories*.name == ['filteredGoogle', 'googleAlias', 'centralAlias', 'MavenLocal',
            'jitpack', 'privateRepo', 'lookalike', 'customPath', 'nonstandardPort', 'query', 'late']
        assert repositories.filteredGoogle.is(originals.filteredGoogle) : 'Repository object was replaced'
        assert repositories.filteredGoogle.url.toString() == 'https://maven.aliyun.com/repository/google'
        assert repositories.googleAlias.url.toString() == 'https://maven.aliyun.com/repository/google'
        assert repositories.centralAlias.url.toString() == 'https://maven.aliyun.com/repository/central'
        assert repositories.late.url.toString() == 'https://maven.aliyun.com/repository/central'
        assert repositories.filteredGoogle.metadataSources.artifactEnabled
        assert !repositories.filteredGoogle.metadataSources.mavenPomEnabled
        def allowed = new FilterInput(group: 'allowed.group')
        def excluded = new FilterInput(group: 'excluded.group')
        repositories.filteredGoogle.contentFilter.execute(allowed)
        repositories.filteredGoogle.contentFilter.execute(excluded)
        assert !allowed.rejected : 'Allowed group was filtered out'
        assert excluded.rejected : 'Content filter was widened during redirection'
        assert repositories.MavenLocal.url.scheme == 'file'
        assert repositories.jitpack.url.toString() == 'https://jitpack.io'
        assert repositories.privateRepo.url.toString() == 'https://private.example.invalid/maven'
        assert repositories.privateRepo.credentials.username == 'fixture'
        assert repositories.privateRepo.credentials.password == 'not-a-secret'
        assert repositories.lookalike.url.toString() == 'https://repo.maven.apache.org.evil.invalid/maven2'
        assert repositories.customPath.url.toString() == 'https://repo.maven.apache.org/private'
        assert repositories.nonstandardPort.url.toString() == 'https://repo.maven.apache.org:8443/maven2'
        assert repositories.query.url.toString() == 'https://repo.maven.apache.org/maven2?token=fixture'
        assert publishing.repositories.first().url.toString() == 'https://repo.maven.apache.org/maven2'
        println 'PASS: included build, aliases, late repositories, identity, metadata, local/private/publishing'
    }
}
